name: Build signed APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install web dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Compute version
        id: version
        run: |
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        env:
          PARKSTOP_KEYSTORE_BASE64: ${{ secrets.PARKSTOP_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$PARKSTOP_KEYSTORE_BASE64" ]; then
            echo "::error::Missing PARKSTOP_KEYSTORE_BASE64 secret. See docs/RELEASE_SIGNING.md to create and store the keystore."
            exit 1
          fi
          echo "$PARKSTOP_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/parkstop-release.keystore"

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        env:
          PARKSTOP_KEYSTORE_PATH: ${{ runner.temp }}/parkstop-release.keystore
          PARKSTOP_KEYSTORE_PASSWORD: ${{ secrets.PARKSTOP_KEYSTORE_PASSWORD }}
          PARKSTOP_KEY_ALIAS: ${{ secrets.PARKSTOP_KEY_ALIAS }}
          PARKSTOP_KEY_PASSWORD: ${{ secrets.PARKSTOP_KEY_PASSWORD }}
          PARKSTOP_VERSION_CODE: ${{ steps.version.outputs.code }}
          PARKSTOP_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Build release AAB (for future Play Store upload)
        working-directory: android
        env:
          PARKSTOP_KEYSTORE_PATH: ${{ runner.temp }}/parkstop-release.keystore
          PARKSTOP_KEYSTORE_PASSWORD: ${{ secrets.PARKSTOP_KEYSTORE_PASSWORD }}
          PARKSTOP_KEY_ALIAS: ${{ secrets.PARKSTOP_KEY_ALIAS }}
          PARKSTOP_KEY_PASSWORD: ${{ secrets.PARKSTOP_KEY_PASSWORD }}
          PARKSTOP_VERSION_CODE: ${{ steps.version.outputs.code }}
          PARKSTOP_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParkStop-${{ steps.version.outputs.name }}-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/ParkStop.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParkStop-${{ steps.version.outputs.name }}
          path: android/app/build/outputs/apk/release/ParkStop.apk
          retention-days: 90

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "ParkStop ${{ steps.version.outputs.name }}"
          body: |
            APK חתום, מוכן להתקנה ישירה (Sideload) על המכשיר.
            גרסה: ${{ steps.version.outputs.name }} (build ${{ steps.version.outputs.code }})
            Commit: ${{ github.sha }}
          make_latest: true
          files: android/app/build/outputs/apk/release/ParkStop.apk
