<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7367f0" />
      <stop offset="100%" stop-color="#4b3aa8" />
    </linearGradient>
    <radialGradient id="sheen" cx="78%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea5455" />
      <stop offset="100%" stop-color="#a62727" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="500" fill="url(#bg)" />
  <rect x="0" y="0" width="1024" height="500" fill="url(#sheen)" />

  <polygon points="893,236 963,236 1013,286 1013,356 963,406 893,406 843,356 843,286"
           fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="18" />

  <!-- app icon mark -->
  <g transform="translate(700,80)">
    <polygon points="113,32 227,32 308,113 308,227 227,308 113,308 32,227 32,113"
             fill="url(#iconGrad)" stroke="#ffffff" stroke-width="10" />
    <text x="170" y="181" text-anchor="middle" dominant-baseline="central"
          font-family="DejaVu Sans" font-weight="bold" font-size="188" fill="#ffffff">P</text>
  </g>

  <line x1="200" y1="270" x2="640" y2="270" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1" />

  <!-- Hebrew copy, right-aligned to match RTL reading -->
  <text x="640" y="108" text-anchor="end" font-family="DejaVu Sans" font-weight="bold" font-size="58" fill="#ffffff">ParkStop</text>
  <text x="640" y="162" text-anchor="end" font-family="DejaVu Sans" font-weight="bold" font-size="26" fill="#e4e1f5">תזכורת חכמה לעצירת חניה</text>

  <text x="640" y="330" text-anchor="end" font-family="DejaVu Sans" font-size="22" fill="#c7c3e0">חוזרים לרכב? מקבלים תזכורת מיידית לעצור את החניה.</text>
  <text x="640" y="364" text-anchor="end" font-family="DejaVu Sans" font-size="22" fill="#c7c3e0">הכל נשאר על המכשיר שלכם — ללא שרת, ללא מעקב.</text>

  <text x="640" y="426" text-anchor="end" font-family="DejaVu Sans" font-weight="bold" font-size="19" fill="#ffffff">Android</text>
  <text x="640" y="454" text-anchor="end" font-family="DejaVu Sans" font-weight="bold" font-size="19" fill="#ffffff">הכל על המכשיר</text>
</svg>
