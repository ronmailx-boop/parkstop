<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page.title | default: "ParkStop" }}</title>
  <link rel="icon" type="image/png" href="{{ '/icon-512.png' | relative_url }}" />
  <style>
    :root {
      --color-primary: #7367f0;
      --color-primary-dark: #7c4ddb;
      --color-bg: #0f0e17;
      --color-surface: #1c1a29;
      --color-text: #f4f3f8;
      --color-text-muted: #a8a4bd;
      --color-border: #35324a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: "Segoe UI", "Assistant", "Rubik", -apple-system, sans-serif;
      direction: rtl;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 32px 20px 60px;
      line-height: 1.7;
    }
    .back-link {
      display: inline-block;
      color: var(--color-text-muted);
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .back-link:hover { color: var(--color-primary); }
    h1 {
      font-size: 26px;
      margin: 0 0 8px;
      background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    h2 {
      font-size: 19px;
      margin: 32px 0 10px;
      color: var(--color-text);
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 8px;
    }
    p, li { color: var(--color-text-muted); font-size: 15.5px; }
    strong { color: var(--color-text); }
    a { color: var(--color-primary); }
    ul, ol { padding-inline-start: 22px; }
    hr { border: none; border-top: 1px solid var(--color-border); margin: 28px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back-link" href="{{ '/' | relative_url }}">‹ חזרה לעמוד הבית</a>
    {{ content }}
  </div>
</body>
</html>
